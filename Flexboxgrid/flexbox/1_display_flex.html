<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        body{
             background-color: black;
        }

        .container-flex{
            /*Largura fixa, o agrupamento acontece dentro dessa largura*/
            height: 180px;
            border: 4px solid red;
            display: flex;
            /*row, column, row-reverse
            flex-direction: row;
            wrap, wrap-reverse, nowrap
            flex-wrap: wrap;
            junção dos dois
            flex-flow: column wrap;*/

        }

        .container-flex>div{
            color: white;
            margin: 4px;
            padding: 4px;
            border: 4px solid white;
        }
    </style>
</head>
<body>
    <h1>
        Display flex
    </h1>

    <div class="container-flex">
        <div>01</div>
        <div>02</div>
        <div>03</div>
        <div>04</div>
        <div>05</div>
        <div>06</div>
        <div>07</div>
        <div>08</div>
        <div>09</div>
        <div>10</div>
        <div>11</div>
        <div>12</div>
    </div>
</body>
</html>
