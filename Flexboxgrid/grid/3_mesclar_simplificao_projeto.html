<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
</head>
<style>
    body{
        font-size: 3rem;
        background-color: black;
        color: white;
        position: relative;
    }

    .grid{
        /*height: 100vh;*/
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        /*fr, ou seja uma parte de 100% da página,
        repeat(3, 1fr) ira dividir em 3 colunas ocupando 100%
        da página
        -auto, ocupa todo o restante do espaço disponível
        */
        grid-template-rows: repeat(3, 1fr);
        gap: 5px;
    }

    .item1{
        /*grid-column-start: ;
        grid-column-end: ;*/
        /*Forma simplificada*/
               /*start*/ /*end*/
        /*grid-column: 1 / 3;*/
        /*grid-row: 1 / 3;*/
        grid-row: span 3;
    }

    .item2{
       grid-column: span 2;
       grid-row: span 3;
    }

    .item3{
        grid-row: span 2;
        grid-column: span 2;
        
    }

    .item4{
        grid-row: span 3;
    }

   

    .grid>div{
        border: 3px solid yellowgreen;
    }
</style>
<body>
    <div class="grid">
        <div class="item1">1</div>
        <div class="item2">2</div>
        <div class="item3">3</div>
        <div class="item4">4</div>
        <div class="item5">5</div>
        <div class="item6">6</div>
        <!--<div class="item7">7</div>
        <div class="item8">8</div>
        <div class="item9">9</div>
        <div class="item10">10</div>
        <div class="item11">11</div>
        <div class="item12">12</div>-->
    </div>
</body>
</html>
