<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação de texto</title>
</head>
<body>
    <!--
    <b>(bolde - negrito) represente um texo diferente em negrito 
    <strong>(forte) representa um texto importante 
    <em> (ênfase) coloca alguma ênfase no texto 
    <mark>(marcação) representa o texto marcado
    -->
  <h2>Formatações de textos</h2>
  <p>Esse é um texto em <b>negrito</b></p>
  <p>Esse é um texto com <strong>impotancia</strong></p>
  <p>Esse é um texto com <em>ênfase</em></p>
  <p>Esse é um texto com <mark>marcação</mark></p>  
</body>
</html>
