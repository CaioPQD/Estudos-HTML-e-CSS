<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de lista</title>
</head>
<body>


    <!--
    ul - Lista sem ordem 
    ol - Lista ordenada
    li - item ou elemento da lista 
    -->
    <h2>Lista não ordenada</h2>
    <ul>
        <li>
            Veiculos
            <ul>
                <li>Seminovos</li>
                <li>O KM</li>
                <li>Leilões</li>
            </ul>
        </li>
        <hr>
        <li>
            Tecnologias
            <ul>
                <li>Celulares e telefones</li>
                <li>Câmeras e acessórios</li>
            </ul>
        </li>
        <hr>

        <li>
            <ol>
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
            </ol>
        </li>
    

    </ul>
        

</body>
</html>
