<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z-index</title>
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
    <h1>Exemplo de z-index</h1>
    <p>O quadrado azul aparece sobre o vermelho porque possui um z-index maior.</p>

    <div class="container">
        <div class="square square-red">
            z-index: 1
        </div>
        <div class="square square-blue">
            z-index: 2
        </div>
    </div>

</body>
</html>
